name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # plone.pageletlayout is not on PyPI; pyproject resolves it from
      # ../plone.pageletlayout, so both checkouts have to end up side by side
      # inside the workspace.
      - uses: actions/checkout@v4
        with:
          path: plonetheme.clara

      - uses: actions/checkout@v4
        with:
          repository: MrTango/plone.pageletlayout
          path: plone.pageletlayout

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        working-directory: plonetheme.clara
        run: uv run --frozen --extra test pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Run ruff
        run: uvx ruff@0.16.4 check .
